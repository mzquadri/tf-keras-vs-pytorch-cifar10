name: CI

on:
  push:
  pull_request:

jobs:
  parameters:
    # The README states "815,018 trainable, asserted at runtime", and train.py
    # does assert it. But training runs in Colab on a GPU, so on an ordinary push
    # nothing checked the claim and the number was only as true as somebody's
    # memory of the last run. This builds the model and counts, which needs no
    # data, no compile and no fit, so the claim is checked on every push.
    name: Trainable parameter count
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The same version the Dockerfile builds on, so a pass here means the
          # same thing as a pass in the image.
          python-version: "3.11"
          cache: pip

      # From requirements.txt, which the Dockerfile also installs from, so a
      # pass here means the same thing as a pass in the image. Pinned rather
      # than floating: a parameter count is a claim about this architecture
      # under this Keras, and letting the version drift would turn an upstream
      # change in how BatchNormalization reports its weights into an apparent
      # failure of the translation, which it would not be.
      - name: Install TensorFlow, CPU only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assert the count matches the PyTorch reference
        env:
          # The model builds in a second; the log noise around it is longer than
          # the output. 2 keeps warnings and errors, drops the info chatter.
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python check_parameters.py
